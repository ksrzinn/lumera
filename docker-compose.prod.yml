# Produção atrás de um proxy HTTPS já existente no servidor.
# Nenhuma porta é publicada no host: o proxy alcança o serviço "cuidar-web" pela rede ${PROXY_NETWORK}.
name: cuidar

services:
  app:
    build:
      context: .
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    restart: unless-stopped
    volumes:
      - .:/var/www/html
    depends_on:
      postgres:
        condition: service_healthy

  # O nome do serviço é único porque ele entra na rede compartilhada com outros projetos.
  cuidar-web:
    image: nginx:1.27-alpine
    restart: unless-stopped
    volumes:
      - .:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - default
      - proxy

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:?defina DB_DATABASE no .env}
      POSTGRES_USER: ${DB_USERNAME:?defina DB_USERNAME no .env}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?defina DB_PASSWORD no .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_DATABASE}"]
      interval: 3s
      timeout: 3s
      retries: 10

networks:
  proxy:
    external: true
    name: ${PROXY_NETWORK:?defina PROXY_NETWORK no .env}

volumes:
  pgdata:
