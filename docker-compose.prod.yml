# Produção em servidor compartilhado: sem proxy na frente, o nginx do Cuidar publica uma porta própria (CUIDAR_PORT).
name: cuidar

services:
  app:
    build:
      context: .
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    restart: unless-stopped
    volumes:
      - .:/var/www/html
    depends_on:
      postgres:
        condition: service_healthy

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${CUIDAR_PORT:-8090}:80"
    volumes:
      - .:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app

  # Sem porta publicada: só o app alcança o banco, pela rede interna do projeto.
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:?defina DB_DATABASE no .env}
      POSTGRES_USER: ${DB_USERNAME:?defina DB_USERNAME no .env}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?defina DB_PASSWORD no .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_DATABASE}"]
      interval: 3s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
